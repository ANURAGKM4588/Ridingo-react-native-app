    <script>
      (function() {
        try {
          // Initialize clean full-screen preview state & detect active app first
          var port = (window.location.port || '');
          var search = (window.location.search || '').toLowerCase();
          var path = (window.location.pathname || '').toLowerCase();
          var hash = (window.location.hash || '').toLowerCase();
          var isDriver = (typeof window !== 'undefined' && window.RIDINGO_TARGET === 'driver') ||
            port === '5174' ||
            search.includes('app=driver') ||
            search.includes('view=driver') ||
            path.includes('/driver') ||
            hash.includes('driver');

          document.documentElement.classList.add('standalone-app');
          document.documentElement.setAttribute('data-app', isDriver ? 'driver' : 'user');
          if (isDriver) {
            document.documentElement.classList.add('standalone-user');
            document.documentElement.classList.remove('standalone-user');
          } else {
            document.documentElement.classList.add('standalone-user');
            document.documentElement.classList.remove('standalone-user');
          }

          // Compute theme strictly according to active app (Driver App: ridingo_driver_theme; User App: untouched)
          var pref;
          if (isDriver) {
            pref = localStorage.getItem('ridingo_driver_theme') || 'light';
          } else {
            pref = localStorage.getItem('ridingo_user_theme') || localStorage.getItem('ridingo_theme_pref') || 'light';
          }

          var isDark = false;
          if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'light') {
            isDark = false;
          } else if (pref === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = false;
          }
          var themeVal = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', themeVal);
          document.documentElement.style.colorScheme = themeVal;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0A0A0B' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>

  <script>
    (function configureNativeBars(){
      function applyStatus(){
        try {
          var saved = null;
          try { saved = localStorage.getItem('ridingo_user_theme'); } catch(e){}
          if (!saved) {
            try { saved = localStorage.getItem('ridingo_theme_pref'); } catch(e){}
          }
          var isDark = false;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            isDark = ('user' === 'driver') ? false : sysDark;
          }
          var bgColor = isDark ? '#0D0E12' : '#F2F2F7';
          var barStyle = isDark ? 'black-translucent' : 'default';

          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.content = bgColor;
          var metaApple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (metaApple) metaApple.content = barStyle;

          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            if (document.body) document.body.setAttribute('data-theme', saved);
          }

          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
            var SB = window.Capacitor.Plugins.StatusBar;
            SB.setStyle({ style: isDark ? 'DARK' : 'LIGHT' }).catch(function(){});
            SB.setBackgroundColor({ color: bgColor }).catch(function(){});
            SB.setOverlaysWebView({ overlay: true }).catch(function(){});
          }
        } catch(e){}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyStatus);
      } else {
        applyStatus();
      }
      setTimeout(applyStatus, 250);
      setTimeout(applyStatus, 800);
    })();
  </script>

      <script>
        (function() {
          try {
            var port = (window.location.port || '');
            var search = (window.location.search || '').toLowerCase();
            var path = (window.location.pathname || '').toLowerCase();

            var isD = (typeof window !== 'undefined' && window.RIDINGO_TARGET === 'driver') ||
              port === '5174' ||
              search.includes('app=driver') ||
              search.includes('view=driver') ||
              path.includes('/driver') ||
              hash.includes('driver') ||
              document.documentElement.getAttribute('data-app') === 'driver';

            if (isD) {
              document.documentElement.setAttribute('data-app', 'driver');
              document.documentElement.classList.add('standalone-user');
              document.documentElement.classList.remove('standalone-user');
              if (document.body) {
                document.body.classList.add('standalone-user');
                document.body.classList.remove('standalone-user');
              }
              // Strictly ensure driver theme is synchronized for driver app splash
              var dPref = localStorage.getItem('ridingo_driver_theme') || 'light';
              var isDriverDark = false;
              if (dPref === 'dark') {
                isDriverDark = true;
              } else if (dPref === 'light') {
                isDriverDark = false;
              } else if (dPref === 'system') {
                isDriverDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
              }
              var dThemeVal = isDriverDark ? 'dark' : 'light';
              document.documentElement.setAttribute('data-theme', dThemeVal);
              document.documentElement.style.colorScheme = dThemeVal;
              if (document.body) {
                document.body.setAttribute('data-theme', dThemeVal);
              }
            } else {
              document.documentElement.setAttribute('data-app', 'user');
              document.documentElement.classList.add('standalone-user');
              document.documentElement.classList.remove('standalone-user');
              if (document.body) {
                document.body.classList.add('standalone-user');
                document.body.classList.remove('standalone-user');
              }
            }
          } catch(e) {}
        })();
      </script>

      <script>
        (function() {
          try {
            var isD = document.documentElement.getAttribute('data-app') === 'driver' ||
              document.documentElement.classList.contains('standalone-user');
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var splash = document.getElementById('app-splash-screen');
            if (splash) {
              // 1. Purge other app logos
              var purgeApp = splash.querySelectorAll(isD ? '.splash-user' : '.splash-driver');
              for (var i = 0; i < purgeApp.length; i++) {
                purgeApp[i].parentNode && purgeApp[i].parentNode.removeChild(purgeApp[i]);
              }
              // 2. Purge opposite theme logos so black logo NEVER renders in dark mode and vice-versa
              var purgeTheme = splash.querySelectorAll(isDark ? '.splash-logo-light' : '.splash-logo-dark');
              for (var j = 0; j < purgeTheme.length; j++) {
                purgeTheme[j].parentNode && purgeTheme[j].parentNode.removeChild(purgeTheme[j]);
              }
            }
          } catch(e) {}
        })();
